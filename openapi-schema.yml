openapi: 3.0.3
info:
  title: Treck API
  version: 1.0.0
  description: API para autenticación, simulaciones, artículos y capacitaciones de
    phishing.
paths:
  /api/articulos/:
    get:
      operationId: articulos_list
      description: Consulta todos los artículos de contexto usados para generar simulaciones.
      summary: Listar artículos
      tags:
      - Artículos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Articulo'
          description: ''
    post:
      operationId: articulos_create
      description: Registra un nuevo artículo de contexto para la base de conocimiento.
      summary: Crear artículo
      tags:
      - Artículos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Articulo'
          description: ''
  /api/articulos/{id}/:
    get:
      operationId: articulos_retrieve
      description: Devuelve el detalle de un artículo específico.
      summary: Obtener artículo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this articulo.
        required: true
      tags:
      - Artículos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Articulo'
          description: ''
    put:
      operationId: articulos_update
      description: Actualiza todos los datos de un artículo existente.
      summary: Actualizar artículo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this articulo.
        required: true
      tags:
      - Artículos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ArticuloRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Articulo'
          description: ''
    patch:
      operationId: articulos_partial_update
      description: Modifica solo los campos enviados de un artículo existente.
      summary: Actualizar artículo parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this articulo.
        required: true
      tags:
      - Artículos
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedArticuloRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedArticuloRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedArticuloRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Articulo'
          description: ''
    delete:
      operationId: articulos_destroy
      description: Elimina un artículo de la base de conocimiento.
      summary: Eliminar artículo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this articulo.
        required: true
      tags:
      - Artículos
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/capacitaciones/ejercicios/:
    get:
      operationId: capacitaciones_ejercicios_list
      description: Obtiene los ejercicios de capacitación disponibles para evaluar
        la detección de phishing.
      summary: Listar ejercicios
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ejercicio'
          description: ''
    post:
      operationId: capacitaciones_ejercicios_create
      description: Registra un nuevo ejercicio de entrenamiento.
      summary: Crear ejercicio
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ejercicio'
          description: ''
  /api/capacitaciones/ejercicios/{id}/:
    get:
      operationId: capacitaciones_ejercicios_retrieve
      description: Devuelve el detalle de un ejercicio específico.
      summary: Obtener ejercicio
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ejercicio.
        required: true
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ejercicio'
          description: ''
    put:
      operationId: capacitaciones_ejercicios_update
      description: Actualiza todos los datos de un ejercicio existente.
      summary: Actualizar ejercicio
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ejercicio.
        required: true
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EjercicioRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ejercicio'
          description: ''
    patch:
      operationId: capacitaciones_ejercicios_partial_update
      description: Modifica solo los campos enviados de un ejercicio existente.
      summary: Actualizar ejercicio parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ejercicio.
        required: true
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEjercicioRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ejercicio'
          description: ''
    delete:
      operationId: capacitaciones_ejercicios_destroy
      description: Elimina un ejercicio de la plataforma.
      summary: Eliminar ejercicio
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this ejercicio.
        required: true
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/capacitaciones/opciones/:
    get:
      operationId: capacitaciones_opciones_list
      description: Devuelve todas las opciones asociadas a los ejercicios de entrenamiento.
      summary: Listar opciones de ejercicio
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpcionEjercicio'
          description: ''
    post:
      operationId: capacitaciones_opciones_create
      description: Registra una nueva opción para un ejercicio.
      summary: Crear opción
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionEjercicio'
          description: ''
  /api/capacitaciones/opciones/{id}/:
    get:
      operationId: capacitaciones_opciones_retrieve
      description: Devuelve una opción de ejercicio específica.
      summary: Obtener opción
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this opcion ejercicio.
        required: true
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionEjercicio'
          description: ''
    put:
      operationId: capacitaciones_opciones_update
      description: Actualiza todos los datos de una opción de ejercicio.
      summary: Actualizar opción
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this opcion ejercicio.
        required: true
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OpcionEjercicioRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionEjercicio'
          description: ''
    patch:
      operationId: capacitaciones_opciones_partial_update
      description: Modifica solo los campos enviados de una opción de ejercicio.
      summary: Actualizar opción parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this opcion ejercicio.
        required: true
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOpcionEjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedOpcionEjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedOpcionEjercicioRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpcionEjercicio'
          description: ''
    delete:
      operationId: capacitaciones_opciones_destroy
      description: Elimina una opción de ejercicio del sistema.
      summary: Eliminar opción
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this opcion ejercicio.
        required: true
      tags:
      - Capacitaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/capacitaciones/responder/:
    post:
      operationId: capacitaciones_responder_create
      description: Evalúa la elección del usuario y devuelve retroalimentación educativa
        contextualizada para reforzar el aprendizaje.
      summary: Responder ejercicio
      tags:
      - Capacitaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponderEjercicioRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResponderEjercicioRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResponderEjercicioRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/generar_simulacion/:
    post:
      operationId: generar_simulacion_create
      description: Genera una simulación de phishing o legítima usando información
        contextual de artículos recientes y feedback educativo.
      summary: Generar simulación con IA
      tags:
      - Simulaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerarSimulacionRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GenerarSimulacionRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GenerarSimulacionRequestRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          description: No response body
  /api/simulaciones/:
    get:
      operationId: simulaciones_list
      description: Consulta todas las simulaciones generadas y asociadas a usuarios
        y artículos.
      summary: Listar simulaciones
      tags:
      - Simulaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Simulacion'
          description: ''
    post:
      operationId: simulaciones_create
      description: Crea una nueva simulación de phishing o legítima.
      summary: Crear simulación
      tags:
      - Simulaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacion'
          description: ''
  /api/simulaciones/{id}/:
    get:
      operationId: simulaciones_retrieve
      description: Devuelve el detalle completo de una simulación específica.
      summary: Obtener simulación
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this simulacion.
        required: true
      tags:
      - Simulaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacion'
          description: ''
    put:
      operationId: simulaciones_update
      description: Actualiza todos los campos de una simulación existente.
      summary: Actualizar simulación
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this simulacion.
        required: true
      tags:
      - Simulaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacion'
          description: ''
    patch:
      operationId: simulaciones_partial_update
      description: Modifica solo los campos enviados de una simulación existente.
      summary: Actualizar simulación parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this simulacion.
        required: true
      tags:
      - Simulaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSimulacionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSimulacionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSimulacionRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacion'
          description: ''
    delete:
      operationId: simulaciones_destroy
      description: Elimina una simulación del sistema.
      summary: Eliminar simulación
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this simulacion.
        required: true
      tags:
      - Simulaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/simulaciones/obtener-aleatoria/:
    get:
      operationId: simulaciones_obtener_aleatoria_retrieve
      description: Devuelve una simulación aleatoria para que el usuario la evalúe
        como phishing o legítima.
      summary: Obtener simulación aleatoria
      tags:
      - Simulaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulacion'
          description: ''
  /api/simulaciones/opuesto/:
    post:
      operationId: simulaciones_opuesto_create
      description: Recupera la versión contraria de una simulación del mismo artículo
        para comparar escenarios phishing y legítimos.
      summary: Obtener simulación opuesta
      tags:
      - Simulaciones
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/simulaciones/registrar-respuesta/:
    post:
      operationId: simulaciones_registrar_respuesta_create
      description: Recibe la decisión del usuario sobre una simulación y devuelve
        si acertó o falló junto con la retroalimentación.
      summary: Registrar respuesta del usuario
      tags:
      - Simulaciones
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SimulacionRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/users/:
    get:
      operationId: users_list
      description: Endpoint administrativo para consultar usuarios registrados.
      summary: Listar usuarios
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
    post:
      operationId: users_create
      description: Crea un nuevo registro de usuario.
      summary: Crear usuario
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: Devuelve los datos de un usuario específico.
      summary: Obtener usuario
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: users_update
      description: Actualiza todos los datos de un usuario existente.
      summary: Actualizar usuario
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: users_partial_update
      description: Actualiza solo los campos enviados para un usuario existente.
      summary: Actualizar usuario parcialmente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: users_destroy
      description: Elimina un usuario del sistema.
      summary: Eliminar usuario
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - Autenticación
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/users/auth/change-password/:
    post:
      operationId: users_auth_change_password_create
      description: Actualiza la contraseña del usuario autenticado validando la contraseña
        actual.
      summary: Cambiar contraseña
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/users/auth/login/:
    post:
      operationId: users_auth_login_create
      description: Autentica un usuario y devuelve un JWT junto con la información
        pública del perfil.
      summary: Iniciar sesión
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenObtainPairRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/users/auth/login/refresh/:
    post:
      operationId: users_auth_login_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/users/auth/register/:
    post:
      operationId: users_auth_register_create
      description: Crea un nuevo usuario con nombre, correo y contraseña segura.
      summary: Registrar usuario
      tags:
      - Autenticación
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
          description: ''
